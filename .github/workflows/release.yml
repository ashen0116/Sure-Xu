name: Android CI

on:
  # 实测：本仓库的 release: published 事件不会被投递（v3.4.1 / v3.4.2 两次发布均为 0 run），
  # 而 push 与 tag 推送都正常，所以主触发改为 tag 推送，release 事件保留作兜底。
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release tag 形如 v1.0.0，去除前导 v 后作为版本号
      - name: Resolve version from tag
        id: resolve_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version=${VERSION}"

      - name: Build with Gradle
        run: ./gradlew assembleRelease -P "version=${{ steps.resolve_version.outputs.VERSION }}"

      # 使用 build-tools 自带 apksigner 为三个 flavor 的 release APK 签名
      - name: Sign release APKs
        id: sign
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"

          # 还原密钥库
          echo "${ANDROID_SIGNING_KEY}" | base64 -d > "$RUNNER_TEMP/sesame-m-release.jks"

          mkdir -p "$RUNNER_TEMP/signed"
          # 单包通吃：normal 同时携带 libxposed(API 102) 与传统 xposed_init(API 82~93) 双入口
          for flavor in normal; do
            APK_DIR="app/build/outputs/apk/$flavor/release"
            ls "$APK_DIR"/*.apk >/dev/null 2>&1 || { echo "No APK found in $APK_DIR"; exit 1; }
            for APK_FILE in "$APK_DIR"/*.apk; do
            APK_NAME=$(basename "$APK_FILE")
            echo "Signing $APK_NAME"

            "$BT_DIR/zipalign" -f 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/sesame-m-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$RUNNER_TEMP/signed/$APK_NAME" \
              "$RUNNER_TEMP/aligned.apk"
            done
          done

      - name: Stage signed APKs into workspace
        run: |
          mkdir -p release-signed
          cp "$RUNNER_TEMP"/signed/*.apk release-signed/
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          for f in release-signed/*.apk; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload signed assets to Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.release.tag_name }}
          files: release-signed/*
          tag_name: ${{ github.ref_name }}
          draft: false
          append_body: true
          generate_release_notes: true
          body: |
            ## ✨What's Changed

            ${{ github.event.head_commit.message || github.event.pull_request.title || '无详细信息' }}
            > ## 下载说明
              * Normal 为单包通吃版：基于 libxposed API 102（LSPosed 等免 Root 框架）+ 传统 Xposed API 82~93（Root / 传统框架）双入口，安装一个即可
              * 要求`Android 8.0`(API 26)及以上系统
            > 倒卖必死全家
